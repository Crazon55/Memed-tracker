# Starts the whole app with one command: docker compose up --build
services:
  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db # keeps the data when the container restarts

  backend:
    build: ./backend
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      MONGODB_URI: mongodb://mongo:27017/memed
      # Set JWT_SECRET in your shell for anything real. This default is only for trying it out.
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me}
      CLIENT_ORIGIN: http://localhost:3000
    depends_on:
      - mongo

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  mongo-data:
